name: kigali_lodge_manager
description: "Kigali Lodge Manager — PMS room management with AI-powered nightly rate prediction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (BLoC — mirrors Brewmaster architecture)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP — calls Kigali Lodge Price Optimizer API
  http: ^1.2.2

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
